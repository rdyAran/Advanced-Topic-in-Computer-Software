name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r 04_flood_nlp_model/requirements.txt pydantic httpx pytest
      - run: python -m pytest -q
      - run: python 05_evaluation/evaluate.py --compare     # rules vs own model, no API key needed
